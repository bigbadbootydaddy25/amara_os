version: "3.9"
services:
  api:
    build: ./apps/api
    ports: ["8080:8080"]
    environment:
      - DISPATCH_URL=http://dispatch:8081
    depends_on: [dispatch]
    networks: [amara]

  dispatch:
    build: ./apps/dispatch
    ports: ["8081:8081"]
    environment:
      - PROPVISION_URL=http://propvision:8082
      - REMOTE_URL=http://remote:8083
    depends_on: [propvision, remote]
    networks: [amara]

  propvision:
    build: ./apps/propvision
    ports: ["8082:8082"]
    volumes:
      - .:/workspace:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONPATH=/workspace
    networks: [amara]

  remote:
    build: ./workers/remote
    ports: ["8083:8083"]
    networks: [amara]

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=amara
      - POSTGRES_USER=amara
      - POSTGRES_PASSWORD=${DB_PASSWORD:-amara_local}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./system/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [amara]

volumes:
  pgdata:

networks:
  amara:
    driver: bridge
