version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Dev override — hot reload for backend + frontend
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      target: builder          # stop at builder stage — no nginx, uses tsx watch
    command: ["npx", "tsx", "watch", "src/server.ts"]
    environment:
      NODE_ENV: development
      DISABLE_PIPELINE_CRON: "true"   # don't run cron in dev
    volumes:
      - ./backend/src:/app/src        # hot reload
      - ./backend/migrations:/app/migrations

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev      # separate lightweight dev image
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    volumes:
      - ./frontend/src:/app/src       # hot reload
