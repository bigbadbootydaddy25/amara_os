<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amara</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    .scene {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* ── Concentric Rings ── */
    .rings {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      animation: ringPulse 4s ease-in-out infinite;
    }

    .ring:nth-child(1) { width: 20vmin; height: 20vmin; border: 2.5px solid rgba(210,218,235,0.42); }
    .ring:nth-child(2) { width: 40vmin; height: 40vmin; border: 2px   solid rgba(210,218,235,0.34); animation-delay: 0.22s; }
    .ring:nth-child(3) { width: 60vmin; height: 60vmin; border: 1.5px solid rgba(210,218,235,0.26); animation-delay: 0.44s; }
    .ring:nth-child(4) { width: 80vmin; height: 80vmin; border: 1.5px solid rgba(210,218,235,0.19); animation-delay: 0.66s; }
    .ring:nth-child(5) { width:100vmin; height:100vmin; border: 1px   solid rgba(210,218,235,0.13); animation-delay: 0.88s; }
    .ring:nth-child(6) { width:120vmin; height:120vmin; border: 1px   solid rgba(210,218,235,0.08); animation-delay: 1.1s;  }

    @keyframes ringPulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50%       { opacity: 1;    transform: scale(1.013); }
    }

    /* ── Face wrapper ── */
    .face-wrap {
      position: relative; z-index: 10;
      height: 88vh;
      animation: breathe 5s ease-in-out infinite;
    }
    .face-wrap svg { height: 100%; width: auto; display: block; }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* ── Eyelid blink ── */
    .eyelid {
      transform-box: fill-box;
      transform-origin: top center;
      transform: scaleY(0);
      animation: blink 7s ease-in-out infinite;
    }
    .eyelid-r { animation-delay: 0.06s; }

    @keyframes blink {
      0%, 83%, 100% { transform: scaleY(0); }
      87%, 91%      { transform: scaleY(1); }
    }

    /* ── State: listening ── */
    .listening .ring {
      border-color: rgba(70, 155, 255, 0.32) !important;
      animation-duration: 1.1s;
    }

    /* ── State: thinking ── */
    .thinking .ring:nth-child(odd)  { animation: spinCW  3s linear infinite; }
    .thinking .ring:nth-child(even) { animation: spinCCW 3.6s linear infinite; }
    @keyframes spinCW  { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    /* ── State: speaking ── */
    .speaking .ring {
      border-color: rgba(130, 200, 255, 0.42) !important;
      animation-duration: 0.55s;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">

    <!-- Concentric rings -->
    <div class="rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>

        <rect x="39" y="195" width="11" height="40" rx="5" fill="#256ab0" opacity="0.88" filter="url(#earGlow)"/>

          <!-- Sclera -->

  <script>
    // ════════════════════════════════════════════════════════
    //  AMARA  —  Animated Conversational ASI
    //  Stage 1: Visual Shell  (voice hooks ready — no voice yet)
    //  States: idle | listening | thinking | speaking
    // ════════════════════════════════════════════════════════

    const scene     = document.getElementById('scene');
    const upperLip  = document.getElementById('upperLip');
    const lowerLip  = document.getElementById('lowerLip');
    const mouthGap  = document.getElementById('mouthGap');
    const teethArea = document.getElementById('teethArea');

    let state      = 'idle';
    let mouthTimer = null;
    let mouthOpen  = false;

    // ── Mouth path sets ──────────────────────────────────────
    const M = {
      closed: {
        lower:  'M 158 319 Q 174 334 200 332 Q 226 334 242 319 Q 226 324 200 322 Q 174 324 158 319 Z',
        gap:    'M 162 317 Q 200 315 238 317',
        teeth:  'M 164 317 Q 200 315 236 317 L 234 325 Q 200 327 166 325 Z'
      },
      open: {
        lower:  'M 158 322 Q 174 340 200 338 Q 226 340 242 322 Q 226 328 200 326 Q 174 328 158 322 Z',
        gap:    'M 162 320 Q 200 318 238 320',
        teeth:  'M 164 320 Q 200 318 236 320 L 234 330 Q 200 332 166 330 Z'
      }
    };

    // ── State machine ────────────────────────────────────────
    function setState(newState) {
      scene.classList.remove('idle', 'listening', 'thinking', 'speaking');
      scene.classList.add(newState);
      state = newState;
      newState === 'speaking' ? startMouth() : stopMouth();
    }

    // ── Lip-sync (randomised cadence for naturalness) ────────
    function startMouth() {
      stopMouth();
      function cycle() {
        mouthOpen = !mouthOpen;
        const m = mouthOpen ? M.open : M.closed;
        lowerLip.setAttribute('d',  m.lower);
        mouthGap.setAttribute('d',  m.gap);
        teethArea.setAttribute('d', m.teeth);
        mouthTimer = setTimeout(cycle, 75 + Math.random() * 130);
      }
      cycle();
    }

    function stopMouth() {
      clearTimeout(mouthTimer);
      mouthTimer = null;
      lowerLip.setAttribute('d',  M.closed.lower);
      mouthGap.setAttribute('d',  M.closed.gap);
      teethArea.setAttribute('d', M.closed.teeth);
    }

    // ── Public API — called by voice layer ───────────────────
    window.amara = {
      setState,
      getState:      () => state,
      onListenStart: () => setState('listening'),
      onThinkStart:  () => setState('thinking'),
      onSpeakStart:  () => setState('speaking'),
      onSpeakEnd:    () => setState('idle'),
    };

    // Initialise
    setState('idle');

    // ════════════════════════════════════════════════════════
    //  VOICE PIPELINE
    //  Mic  →  Web Speech API  →  Claude  →  ElevenLabs  →  Audio
    // ════════════════════════════════════════════════════════

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { console.warn('SpeechRecognition not supported in this browser.'); }

    const recognition       = SR ? new SR() : null;
    const conversationHistory = [];
    let   isProcessing      = false;

    if (recognition) {
      recognition.continuous     = false;
      recognition.interimResults = false;
      recognition.lang           = 'en-US';

      recognition.onstart = () => {
        if (!isProcessing) setState('listening');
      };

      recognition.onresult = async (e) => {
        const transcript = e.results[0][0].transcript.trim();
        if (!transcript) return;
        isProcessing = true;
        await runPipeline(transcript);
        isProcessing = false;
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech') return;
        console.warn('[SR]', e.error);
        setState('idle');
      };

      recognition.onend = () => {
        if (!isProcessing) restartListening();
      };
    }

    function restartListening() {
      setTimeout(() => {
        try { recognition && recognition.start(); } catch (_) {}
      }, 350);
    }

    // ── Pipeline: listen → think → speak ────────────────────
    async function runPipeline(text) {
      try {
        // 1. Think
        setState('thinking');
        conversationHistory.push({ role: 'user', content: text });

        const chatRes = await fetch('/api/chat', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ messages: conversationHistory })
        });

        if (!chatRes.ok) throw new Error(`Chat ${chatRes.status}`);
        const { text: reply } = await chatRes.json();
        conversationHistory.push({ role: 'assistant', content: reply });

        // 2. Speak
        await speakText(reply);

      } catch (err) {
        console.error('[pipeline]', err);
        setState('idle');
        restartListening();
      }
    }

    async function speakText(text) {
      setState('speaking');

      const res = await fetch('/api/speak', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ text })
      });

      if (!res.ok) {
        console.error('[speak] upstream error', res.status);
        setState('idle');
        restartListening();
        return;
      }

      const blob  = await res.blob();
      const url   = URL.createObjectURL(blob);
      const audio = new Audio(url);

      audio.onended = () => {
        URL.revokeObjectURL(url);
        setState('idle');
        restartListening();
      };
      audio.onerror = () => {
        setState('idle');
        restartListening();
      };

      await audio.play();
    }

    // ── Boot: start listening after short delay ──────────────
    setTimeout(() => {
      try { recognition && recognition.start(); } catch (_) {}
    }, 800);
  </script>
