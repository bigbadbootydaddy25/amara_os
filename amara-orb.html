<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AMARA</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body.show-cursor { cursor: default; }
  canvas { display: block; position: fixed; inset: 0; width: 100% !important; height: 100% !important; }
  #vignette {
    pointer-events: none; position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.38) 65%, rgba(0,0,0,0.82) 100%);
  }
  #activate-overlay {
    position: fixed; inset: 0; background: transparent;
    z-index: 40; cursor: pointer;
  }
  #browser-layer {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%; border: none; display: none;
  }
  #orb-wrap {
    position: fixed; inset: 0; z-index: 5;
    transform: scale(1);
    transform-origin: calc(100% - 20px) calc(100% - 20px);
    transition: transform 0.65s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  #orb-wrap.minimized { transform: scale(0.16); }
  #restore-overlay {
    display: none; position: fixed; inset: 0; z-index: 35;
    cursor: pointer; background: transparent;
  }
  #restore-overlay.active { display: block; }
</style>
</head>
<body>
<iframe id="browser-layer" src="about:blank"></iframe>
<div id="orb-wrap">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
</div>
<div id="restore-overlay"></div>
<div id="activate-overlay"></div>

<script type="module">
import * as THREE from './three.module.min.js';

// ── Constants ─────────────────────────────────────────────────────────────────
const SPHERE_R      = 2.0;
const NODE_COUNT    = 320;
const MAX_EDGES     = 3000;
const PARTICLE_CNT  = 350;
const AMB_CNT       = 120;

// ── Animation state ───────────────────────────────────────────────────────────
let currentState = 'idle';
let time = 0, lastT = 0;
let sBright = 0.55, sConn = 0.65, sRot = 0.004, sHalo = 1.0;
let aLow = 0, aMid = 0, aHigh = 0, aOverall = 0, aMic = 0;
let isMinimized = false, icePulseTime = -99;

// ── Audio ─────────────────────────────────────────────────────────────────────
let outAnalyser = null, micAnalyser = null;
let outData = new Uint8Array(256), micData = new Uint8Array(256);

// ── Three.js refs (assigned in initOrb) ───────────────────────────────────────
let renderer, scene, camera;
let orbGroup;
let nodePos, nodeColor, nodeGeom, nodeData = [];
let edgePos, edgeColor, edgeGeom, edgePairs = [];
let haloSprite;
let partPos, partVel, partLife, partGeom;
let ambPos, ambGeom, ambOrbit = [];

// ── Helpers ───────────────────────────────────────────────────────────────────
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const bandAvg = (data, s, e) => {
  const l = data.length, si = Math.floor(l*s), ei = Math.floor(l*e);
  let sum = 0; for (let i = si; i < ei; i++) sum += data[i];
  return sum / ((ei-si)*255||1);
};

// ── Texture factories ─────────────────────────────────────────────────────────
function mkGradTex(sz, stops) {
  const c = document.createElement('canvas'); c.width = c.height = sz;
  const ctx = c.getContext('2d'), h = sz/2;
  const g = ctx.createRadialGradient(h,h,0,h,h,h);
  stops.forEach(([t, s]) => g.addColorStop(t, s));
  ctx.fillStyle = g; ctx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(c);
}

// 4-ray star-sparkle node texture
function makeStarTex() {
  const sz = 128;
  const c = document.createElement('canvas'); c.width = c.height = sz;
  const ctx = c.getContext('2d'), h = sz/2;
  for (let ray = 0; ray < 4; ray++) {
    ctx.save(); ctx.translate(h, h); ctx.rotate(ray * Math.PI / 4);
    const rg = ctx.createLinearGradient(-h, 0, h, 0);
    rg.addColorStop(0,   'rgba(0,210,255,0)');
    rg.addColorStop(0.28,'rgba(60,220,255,0.5)');
    rg.addColorStop(0.5, 'rgba(255,255,255,1)');
    rg.addColorStop(0.72,'rgba(60,220,255,0.5)');
    rg.addColorStop(1,   'rgba(0,210,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(-h, -1.5, sz, 3);
    ctx.restore();
  }
  const g = ctx.createRadialGradient(h,h,0,h,h,h*0.36);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(210,248,255,0.95)');
  g.addColorStop(0.7, 'rgba(0,210,255,0.5)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(c);
}

// Purple variant star texture for accent nodes
function makePurpleStarTex() {
  const sz = 128;
  const c = document.createElement('canvas'); c.width = c.height = sz;
  const ctx = c.getContext('2d'), h = sz/2;
  for (let ray = 0; ray < 4; ray++) {
    ctx.save(); ctx.translate(h, h); ctx.rotate(ray * Math.PI / 4);
    const rg = ctx.createLinearGradient(-h, 0, h, 0);
    rg.addColorStop(0,   'rgba(140,0,255,0)');
    rg.addColorStop(0.28,'rgba(180,60,255,0.5)');
    rg.addColorStop(0.5, 'rgba(255,255,255,1)');
    rg.addColorStop(0.72,'rgba(180,60,255,0.5)');
    rg.addColorStop(1,   'rgba(140,0,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(-h, -1.5, sz, 3);
    ctx.restore();
  }
  const g = ctx.createRadialGradient(h,h,0,h,h,h*0.36);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(230,200,255,0.95)');
  g.addColorStop(0.7, 'rgba(160,0,255,0.5)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(c);
}

const makeHaloTex = () => mkGradTex(512, [
  [0,    'rgba(0,0,0,0)'],
  [0.28, 'rgba(0,0,0,0)'],
  [0.44, 'rgba(0,180,255,0.05)'],
  [0.58, 'rgba(0,200,255,0.18)'],
  [0.72, 'rgba(0,100,200,0.14)'],
  [0.84, 'rgba(60,0,160,0.12)'],
  [0.93, 'rgba(20,0,80,0.06)'],
  [1,    'rgba(0,0,0,0)'],
]);

const makeParticleTex = () => mkGradTex(64, [
  [0,    'rgba(255,255,255,1)'],
  [0.30, 'rgba(200,245,255,0.8)'],
  [0.65, 'rgba(0,200,255,0.25)'],
  [1,    'rgba(0,0,0,0)'],
]);

const makeAmbientTex = () => mkGradTex(32, [
  [0,   'rgba(100,200,255,0.9)'],
  [0.5, 'rgba(100,0,200,0.4)'],
  [1,   'rgba(0,0,0,0)'],
]);

// ── Orbital basis helper ──────────────────────────────────────────────────────
function perpBasis(nx, ny, nz) {
  let ax = Math.abs(nx) < 0.9 ? 1 : 0, ay = Math.abs(nx) < 0.9 ? 0 : 1, az = 0;
  let u1x = ny*az - nz*ay, u1y = nz*ax - nx*az, u1z = nx*ay - ny*ax;
  const u1l = Math.sqrt(u1x*u1x + u1y*u1y + u1z*u1z) || 1;
  u1x /= u1l; u1y /= u1l; u1z /= u1l;
  return [u1x, u1y, u1z, ny*u1z - nz*u1y, nz*u1x - nx*u1z, nx*u1y - ny*u1x];
}

// ── Node color helper ─────────────────────────────────────────────────────────
function nodeRGB(ct, b) {
  if (ct === 1) return [0.72*b, 0.10*b, b];          // purple
  if (ct === 2) return [0.75*b, 0.90*b, b];          // white-blue
  return [0, 0.831*b, b];                             // cyan (default)
}

// ── Lazy init ─────────────────────────────────────────────────────────────────
function initOrb() {
  const canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(52, 1, 0.01, 100);
  camera.position.z = 4.4;
  orbGroup = new THREE.Group();
  scene.add(orbGroup);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  // ── Nodes (all on sphere surface, fibonacci distribution) ─────────────────
  nodePos   = new Float32Array(NODE_COUNT * 3);
  nodeColor = new Float32Array(NODE_COUNT * 3);
  nodeGeom  = new THREE.BufferGeometry();
  nodeGeom.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
  nodeGeom.setAttribute('color',    new THREE.BufferAttribute(nodeColor, 3));
  nodeData  = [];

  const golden = Math.PI * (Math.sqrt(5) - 1);
  const starTex   = makeStarTex();
  const purpleTex = makePurpleStarTex();

  for (let i = 0; i < NODE_COUNT; i++) {
    const y = 1 - (i / (NODE_COUNT-1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y*y));
    const th = golden * i;
    const rnd = Math.random();
    const ct = rnd < 0.72 ? 0 : rnd < 0.90 ? 1 : 2;
    nodeData.push({
      bx: Math.cos(th)*r*SPHERE_R, by: y*SPHERE_R, bz: Math.sin(th)*r*SPHERE_R,
      px: 0, py: 0, pz: 0,
      phx: Math.random()*6.28, phy: Math.random()*6.28, phz: Math.random()*6.28,
      spx: 0.08+Math.random()*0.16, spy: 0.07+Math.random()*0.13, spz: 0.06+Math.random()*0.15,
      amp: 0.018+Math.random()*0.038, bright: 0.5+Math.random()*0.5, ct,
    });
  }

  // Single Points object — use cyan texture (purple nodes tinted via vertexColors)
  orbGroup.add(new THREE.Points(nodeGeom, new THREE.PointsMaterial({
    size: 0.28, map: starTex, vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
  })));

  // ── Pre-compute edge connectivity (short always + probabilistic long) ──────
  edgePos   = new Float32Array(MAX_EDGES * 6);
  edgeColor = new Float32Array(MAX_EDGES * 6);
  edgeGeom  = new THREE.BufferGeometry();
  edgeGeom.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
  edgeGeom.setAttribute('color',    new THREE.BufferAttribute(edgeColor, 3));
  edgeGeom.setDrawRange(0, 0);
  orbGroup.add(new THREE.LineSegments(edgeGeom, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  })));

  edgePairs = [];
  // Shuffle indices for uniform distribution
  const order = Array.from({length: NODE_COUNT}, (_,i) => i).sort(() => Math.random()-0.5);
  for (let ai = 0; ai < NODE_COUNT && edgePairs.length < MAX_EDGES; ai++) {
    const a = order[ai]; const na = nodeData[a];
    for (let bi = ai+1; bi < NODE_COUNT && edgePairs.length < MAX_EDGES; bi++) {
      const b = order[bi]; const nb = nodeData[b];
      const dx=na.bx-nb.bx, dy=na.by-nb.by, dz=na.bz-nb.bz;
      const d = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if (d > 3.6) continue;
      const prob = d < 1.0 ? 1.0 : 0.10 * Math.pow((3.6-d)/2.6, 2.0);
      if (Math.random() < prob) edgePairs.push([a, b]);
    }
  }

  // ── Outer atmospheric halo ────────────────────────────────────────────────
  haloSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeHaloTex(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  haloSprite.scale.set(9.5, 9.5, 1);
  scene.add(haloSprite);

  // ── Burst particles ───────────────────────────────────────────────────────
  partPos  = new Float32Array(PARTICLE_CNT * 3).fill(999);
  partVel  = new Float32Array(PARTICLE_CNT * 3);
  partLife = new Float32Array(PARTICLE_CNT);
  partGeom = new THREE.BufferGeometry();
  partGeom.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
  partGeom.setDrawRange(0, 0);
  scene.add(new THREE.Points(partGeom, new THREE.PointsMaterial({
    map: makeParticleTex(), size: 0.15, transparent: true, opacity: 0.95,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
  })));

  // ── Ambient energy field ──────────────────────────────────────────────────
  ambPos   = new Float32Array(AMB_CNT * 3);
  ambOrbit = [];
  for (let i = 0; i < AMB_CNT; i++) {
    const r   = SPHERE_R * (1.06 + Math.random() * 0.52);
    const spd = (0.07 + Math.random() * 0.28) * (Math.random() < 0.5 ? 1 : -1);
    const ang = Math.random() * Math.PI * 2;
    const nx = Math.random()-0.5, ny = Math.random()-0.5, nz = Math.random()-0.5;
    const nl = Math.sqrt(nx*nx+ny*ny+nz*nz) || 1;
    const basis = perpBasis(nx/nl, ny/nl, nz/nl);
    ambOrbit.push({ r, spd, ang, basis });
    const cos = Math.cos(ang), sin = Math.sin(ang);
    ambPos[i*3]   = cos*basis[0]*r + sin*basis[3]*r;
    ambPos[i*3+1] = cos*basis[1]*r + sin*basis[4]*r;
    ambPos[i*3+2] = cos*basis[2]*r + sin*basis[5]*r;
  }
  ambGeom = new THREE.BufferGeometry();
  ambGeom.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
  scene.add(new THREE.Points(ambGeom, new THREE.PointsMaterial({
    map: makeAmbientTex(), size: 0.055, transparent: true, opacity: 0.65,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
  })));

  requestAnimationFrame(tick);
}

// ── Animation loop ────────────────────────────────────────────────────────────
function tick(ts) {
  const dt = lastT ? Math.min((ts-lastT)/1000, 0.05) : 0.016;
  lastT = ts; time += dt;

  sampleAudio();
  computeTargets();
  updateNodes();
  updateEdges();
  updateOrbRotation();
  updateHalo();
  updateParticles(dt);
  updateAmbient(dt);
  updateCamera();

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function sampleAudio() {
  if (outAnalyser) {
    outAnalyser.getByteFrequencyData(outData);
    aLow     = lerp(aLow,     bandAvg(outData, 0, 0.12), 0.15);
    aMid     = lerp(aMid,     bandAvg(outData, 0.12, 0.5), 0.12);
    aHigh    = lerp(aHigh,    bandAvg(outData, 0.5, 1.0), 0.10);
    aOverall = lerp(aOverall, bandAvg(outData, 0, 1), 0.14);
  } else { aLow = aMid = aHigh = aOverall = lerp(aOverall, 0, 0.08); }
  if (micAnalyser) {
    micAnalyser.getByteFrequencyData(micData);
    aMic = lerp(aMic, bandAvg(micData, 0, 0.5), 0.18);
  } else { aMic = lerp(aMic, 0, 0.10); }
}

// ── Targets ───────────────────────────────────────────────────────────────────
function computeTargets() {
  const b = (Math.sin(time*0.7)+1)*0.5;
  let tB, tC, tR, tH;
  switch (currentState) {
    case 'idle':
      tB=0.52+b*0.14; tC=0.62+b*0.12; tR=0.0032+b*0.001; tH=0.90+b*0.08; break;
    case 'listening':
      tB=0.44+aMic*0.48+(Math.sin(time*1.8)+1)*0.06;
      tC=0.58+aMic*0.35; tR=0.002+aMic*0.005; tH=0.96+aMic*0.30; break;
    case 'thinking': {
      const p=(Math.sin(time*4.8)+1)*0.5;
      tB=0.68+p*0.28; tC=0.80+p*0.18; tR=0.010+p*0.006; tH=1.10+p*0.18; break;
    }
    case 'speaking':
      tB=0.62+aMid*0.45+aHigh*0.22; tC=0.72+aOverall*0.48;
      tR=0.006+aLow*0.014; tH=1.08+aOverall*0.92; break;
    default: tB=0.52; tC=0.62; tR=0.0032; tH=0.90;
  }
  const sm=0.07;
  sBright=lerp(sBright,tB,sm); sConn=lerp(sConn,tC,sm*1.2);
  sRot=lerp(sRot,tR,sm*0.6); sHalo=lerp(sHalo,tH,sm*0.8);
  // Ice-blue navigation pulse overrides targets briefly
  if (time - icePulseTime < 1.8) {
    const pulse=(Math.sin(time*7.5)+1)*0.5;
    sBright=lerp(sBright, 0.88+pulse*0.12, 0.22);
    sHalo  =lerp(sHalo,   1.6 +pulse*0.28, 0.18);
    sConn  =lerp(sConn,   0.92,             0.22);
  }
}

// ── Nodes ─────────────────────────────────────────────────────────────────────
function updateNodes() {
  for (let i = 0; i < NODE_COUNT; i++) {
    const n = nodeData[i];
    n.px = n.bx + Math.sin(time*n.spx+n.phx)*n.amp;
    n.py = n.by + Math.sin(time*n.spy+n.phy)*n.amp;
    n.pz = n.bz + Math.sin(time*n.spz+n.phz)*n.amp;
    const len = Math.sqrt(n.px*n.px+n.py*n.py+n.pz*n.pz);
    if (len > SPHERE_R) { const s=SPHERE_R/len; n.px*=s; n.py*=s; n.pz*=s; }
    nodePos[i*3]=n.px; nodePos[i*3+1]=n.py; nodePos[i*3+2]=n.pz;

    const sparkle=(Math.sin(time*2.2+n.phx*13)+1)*0.5;
    const audioB = currentState==='speaking'  ? aMid*0.55+aHigh*0.32
                 : currentState==='listening' ? aMic*0.38
                 : currentState==='thinking'  ? (Math.sin(time*5.2+n.phz*3)+1)*0.30 : 0;
    const tgt=clamp(sBright*n.bright+sparkle*0.18+audioB, 0.08, 1.0);
    n.bright=lerp(n.bright, tgt, 0.09+audioB*0.12);

    const [r,g,bv] = nodeRGB(n.ct, n.bright);
    nodeColor[i*3]=r; nodeColor[i*3+1]=g; nodeColor[i*3+2]=bv;
  }
  nodeGeom.attributes.position.needsUpdate=true;
  nodeGeom.attributes.color.needsUpdate=true;
}

// ── Edges (pre-computed pairs, per-frame position + color update) ──────────────
function updateEdges() {
  const maxE = Math.min(edgePairs.length, Math.floor(edgePairs.length * clamp(sConn, 0.1, 1.0)));
  for (let idx = 0; idx < maxE; idx++) {
    const [ai, bi] = edgePairs[idx];
    const na = nodeData[ai], nb = nodeData[bi];
    const pulse = 0.52 + 0.48*Math.sin(time*3.0 + idx*0.35);
    const cA = clamp(sConn * na.bright * 0.92 * pulse, 0, 1);
    const cB = clamp(sConn * nb.bright * 0.92 * pulse, 0, 1);
    const base = idx*6;
    edgePos[base]=na.px; edgePos[base+1]=na.py; edgePos[base+2]=na.pz;
    edgePos[base+3]=nb.px; edgePos[base+4]=nb.py; edgePos[base+5]=nb.pz;
    const [rA,gA,bA]=nodeRGB(na.ct,cA); edgeColor[base]=rA; edgeColor[base+1]=gA; edgeColor[base+2]=bA;
    const [rB,gB,bB]=nodeRGB(nb.ct,cB); edgeColor[base+3]=rB; edgeColor[base+4]=gB; edgeColor[base+5]=bB;
  }
  edgeGeom.attributes.position.needsUpdate=true;
  edgeGeom.attributes.color.needsUpdate=true;
  edgeGeom.setDrawRange(0, maxE*2);
}

// ── Orb rotation ──────────────────────────────────────────────────────────────
function updateOrbRotation() {
  const rotSpeed=sRot*(1+aLow*1.4);
  orbGroup.rotation.y+=rotSpeed;
  orbGroup.rotation.x+=rotSpeed*0.22;
  orbGroup.rotation.z+=rotSpeed*0.09;
}

// ── Halo ──────────────────────────────────────────────────────────────────────
function updateHalo() {
  const s=sHalo*9.5; haloSprite.scale.set(s,s,1);
}

// ── Burst particles ───────────────────────────────────────────────────────────
function updateParticles(dt) {
  let active=0;
  for (let i=0; i<PARTICLE_CNT; i++) {
    if (partLife[i]<=0) continue;
    partLife[i]-=dt;
    if (partLife[i]<=0) { partPos[i*3]=partPos[i*3+1]=partPos[i*3+2]=999; continue; }
    const drag=Math.pow(0.86, dt*60);
    partVel[i*3]*=drag; partVel[i*3+1]*=drag; partVel[i*3+2]*=drag;
    partPos[i*3]+=partVel[i*3]*dt; partPos[i*3+1]+=partVel[i*3+1]*dt; partPos[i*3+2]+=partVel[i*3+2]*dt;
    active++;
  }
  partGeom.attributes.position.needsUpdate=true;
  partGeom.setDrawRange(0, active>0?PARTICLE_CNT:0);
}

// ── Ambient energy field ──────────────────────────────────────────────────────
function updateAmbient(dt) {
  for (let i=0; i<AMB_CNT; i++) {
    const o=ambOrbit[i];
    o.ang+=o.spd*dt;
    const cos=Math.cos(o.ang), sin=Math.sin(o.ang);
    ambPos[i*3]  =cos*o.basis[0]*o.r+sin*o.basis[3]*o.r;
    ambPos[i*3+1]=cos*o.basis[1]*o.r+sin*o.basis[4]*o.r;
    ambPos[i*3+2]=cos*o.basis[2]*o.r+sin*o.basis[5]*o.r;
  }
  ambGeom.attributes.position.needsUpdate=true;
}

// ── Subtle camera drift ───────────────────────────────────────────────────────
function updateCamera() {
  camera.position.x=Math.sin(time*0.055)*0.10;
  camera.position.y=Math.sin(time*0.082)*0.07;
  camera.lookAt(0,0,0);
}

// ── Particle burst ────────────────────────────────────────────────────────────
function spawnBurst() {
  let spawned=0;
  const count=200+Math.floor(Math.random()*60);
  for (let i=0; i<PARTICLE_CNT&&spawned<count; i++) {
    if (partLife[i]>0) continue;
    const th=Math.random()*6.28, ph=Math.acos(2*Math.random()-1);
    const px=SPHERE_R*Math.sin(ph)*Math.cos(th);
    const py=SPHERE_R*Math.sin(ph)*Math.sin(th);
    const pz=SPHERE_R*Math.cos(ph);
    partPos[i*3]=px; partPos[i*3+1]=py; partPos[i*3+2]=pz;
    const spd=1.8+Math.random()*3.2;
    partVel[i*3]  =(px/SPHERE_R)*spd+(Math.random()-0.5)*0.5;
    partVel[i*3+1]=(py/SPHERE_R)*spd+(Math.random()-0.5)*0.5;
    partVel[i*3+2]=(pz/SPHERE_R)*spd+(Math.random()-0.5)*0.5;
    partLife[i]=1.0+Math.random()*0.9;
    spawned++;
  }
}

window.setAMARAState = (state) => {
  const s = state==='processing'?'thinking':state;
  if (!['idle','listening','thinking','speaking'].includes(s)) return;
  currentState=s;
};
window.triggerWakeWord   = () => { if (partGeom) spawnBurst(); };
window.setAMARAOutputAudio = (node) => {

// ── Minimize / restore ────────────────────────────────────────────────────────
const orbWrap      = document.getElementById('orb-wrap');
const restoreOvlay = document.getElementById('restore-overlay');

function minimizeOrb() {
  isMinimized = true;
  orbWrap.classList.add('minimized');
  restoreOvlay.classList.add('active');
}
function restoreOrb() {
  isMinimized = false;
  orbWrap.classList.remove('minimized');
  restoreOvlay.classList.remove('active');
}
restoreOvlay.addEventListener('click', restoreOrb);

// ── Browser layer ─────────────────────────────────────────────────────────────
const browserLayer = document.getElementById('browser-layer');

const URL_MAP = {
  'youtube':        'https://www.youtube.com',
  'gmail':          'https://mail.google.com',
  'google':         'https://www.google.com',
  'courtlistener':  'https://www.courtlistener.com',
  'court listener': 'https://www.courtlistener.com',
  'twitter':        'https://twitter.com',
  'reddit':         'https://www.reddit.com',
  'github':         'https://github.com',
  'wikipedia':      'https://wikipedia.org',
  'netflix':        'https://www.netflix.com',
  'spotify':        'https://open.spotify.com',
  'amazon':         'https://www.amazon.com',
  'maps':           'https://maps.google.com',
  'weather':        'https://forecast.weather.gov',
  'news':           'https://news.google.com',
};

function resolveUrl(target) {
  const t = target.toLowerCase().trim();
  for (const [k, u] of Object.entries(URL_MAP)) {
    if (t.includes(k)) return u;
  }
  const slug = t.replace(/\s+/g, '');
  if (/^[\w-]+\.[a-z]{2,}/.test(slug)) return `https://${slug}`;
  return `https://www.google.com/search?q=${encodeURIComponent(target)}`;
}

function navigateBrowser(target) {
  browserLayer.src = resolveUrl(target);
  browserLayer.style.display = 'block';
  icePulseTime = time;
  if (partGeom) spawnBurst();
}

function closeBrowser() {
  browserLayer.style.display = 'none';
  browserLayer.src = 'about:blank';
}

// ── Command parser (runs before TTS on every final transcript) ────────────────
function parseCommand(text) {
  const t = text.toLowerCase().trim();

  // Minimize — only on explicit command, never auto
  if (/\b(minimize|go small|shrink|make yourself small|get small|be small)\b/.test(t)) {
    minimizeOrb(); return true;
  }

  // Any other speech → restore if minimized
  if (isMinimized) restoreOrb();

  // Close browser
  if (/\b(close browser|close the page|close that|hide browser|close window)\b/.test(t)) {
    closeBrowser(); return true;
  }

  // Navigation
  const nav = t.match(/\b(?:show me|pull up|open|go to|navigate to|flip to|switch to|take me to|load)\s+(.+)/);
  if (nav) { navigateBrowser(nav[1].trim()); return false; }

  return false;
}

// ── ElevenLabs TTS ────────────────────────────────────────────────────────────
const EL_KEY   = 'sk_b6f0ec19d447538de677a5ac7151d38e68226e0881a6cf0a';
const EL_VOICE = '1hlpeD1ydbI2ow0Tt3EW';
let ttsAudio = null, ttsCtx = null, isSpeaking = false;

async function ttsSpeak(text) {
  if (!text || isSpeaking) return;
  isSpeaking = true;
  clearTimeout(silenceTimer);
  window.setAMARAState('thinking');
  setStatus('PROCESSING...');

  try {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`, {
      method: 'POST',
      headers: {
        'xi-api-key': EL_KEY,
        'Content-Type': 'application/json',
        'Accept': 'audio/mpeg',
      },
      body: JSON.stringify({
        text,
        model_id: 'eleven_turbo_v2_5',
        voice_settings: { stability: 0.48, similarity_boost: 0.78, style: 0.12, use_speaker_boost: true },
      }),
    });

    if (!res.ok) throw new Error(`ElevenLabs ${res.status}`);

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);

    if (ttsAudio) ttsAudio.pause();
    if (ttsCtx)   ttsCtx.close();

    ttsAudio = new Audio(url);
    ttsCtx   = new AudioContext();

    const src = ttsCtx.createMediaElementSource(ttsAudio);
    window.setAMARAOutputAudio(src);   // wire into orb visualizer
    src.connect(ttsCtx.destination);   // also route to speakers

    window.setAMARAState('speaking');
    setStatus('SPEAKING');
    ttsAudio.play();

    ttsAudio.onended = () => {
      URL.revokeObjectURL(url);
      isSpeaking = false;
      showTranscript('', false);
      window.setAMARAState('idle');
      setStatus('LISTENING');
    };
  } catch (e) {
    console.error('ElevenLabs error:', e);
    isSpeaking = false;
    window.setAMARAState('idle');
    setStatus('LISTENING');
  }
}

// Expose so external callers (LLM, tests) can trigger AMARA speech
window.setAMARAResponse = ttsSpeak;

// ── Deepgram STT ──────────────────────────────────────────────────────────────
const DG_KEY = '5d509864bed0d109bdbd4895b8d139ef90f375a3';
let dgSocket = null, micStream = null, audioCtx = null, scriptProc = null;
let silenceTimer = null;

function setStatus() {}
function showTranscript() {}

async function startDeepgram() {
  setStatus('REQUESTING MIC...');
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setStatus('MIC DENIED'); console.error('Mic:', e); return;
  }

  // Wire mic into orb visualizer
  const tmpCtx = new AudioContext();
  const micSrc = tmpCtx.createMediaStreamSource(micStream);
  window.setAMARAMicAudio(micSrc);

  // 16kHz context for Deepgram
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const src = audioCtx.createMediaStreamSource(micStream);
  scriptProc = audioCtx.createScriptProcessor(4096, 1, 1);

  const dgUrl = [
    'wss://api.deepgram.com/v1/listen',
    `?token=${DG_KEY}`,
    '&model=nova-3',
    '&language=en-GB',
    '&encoding=linear16',
    '&sample_rate=16000',
    '&channels=1',
    '&interim_results=true',
    '&smart_format=true',
    '&vad_events=true',
    '&utterance_end_ms=1200',
  ].join('');

  dgSocket = new WebSocket(dgUrl);
  dgSocket.binaryType = 'arraybuffer';

  dgSocket.onopen = () => {
    setStatus('LISTENING');
    src.connect(scriptProc);
    scriptProc.connect(audioCtx.destination);
    scriptProc.onaudioprocess = (ev) => {
      if (dgSocket.readyState !== WebSocket.OPEN) return;
      const f32 = ev.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f32.length);
      for (let i = 0; i < f32.length; i++)
        i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
      dgSocket.send(i16.buffer);
    };
  };

  dgSocket.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    // Voice activity events — ignore while TTS is playing
    if (msg.type === 'SpeechStarted') {
      if (!isSpeaking) {
        clearTimeout(silenceTimer);
        window.setAMARAState('listening');
        if (isMinimized) restoreOrb();
      }
    } else if (msg.type === 'UtteranceEnd') {
      if (!isSpeaking) {
        silenceTimer = setTimeout(() => { showTranscript('', false); window.setAMARAState('idle'); }, 900);
      }
    }

    // Transcript
    if (msg.channel?.alternatives?.[0]) {
      const text = msg.channel.alternatives[0].transcript?.trim();
      if (text) {
        showTranscript(text, msg.is_final);
        if (msg.is_final) {
          clearTimeout(silenceTimer);
          if (!parseCommand(text)) ttsSpeak(text);
        }
      }
    }
  };

  dgSocket.onerror = (e) => { setStatus('DG ERROR'); console.error('Deepgram:', e); };
  dgSocket.onclose = () => { setStatus(''); };
}

  if (micReady) return; micReady=true;

}

document.addEventListener('keydown', (e) => {
  if      (e.key==='1') window.setAMARAState('idle');
  else if (e.key==='2') window.setAMARAState('listening');
  else if (e.key==='3') window.setAMARAState('processing');
  else if (e.key==='4') window.setAMARAState('speaking');
  else if (e.key===' ') window.triggerWakeWord();
});
